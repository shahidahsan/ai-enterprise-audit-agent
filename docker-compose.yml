services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_agent -d audit_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
